version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: language_app_db
    restart: always
    environment:
      POSTGRES_USER: myrebel
      POSTGRES_PASSWORD: myrebel3
      POSTGRES_DB: language_db
    ports:
      - '5433:5432'
    volumes:
      - language_app_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: language_app_redis
    restart: always
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
  minio:
    image: minio/minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"



volumes:
  language_app_data:
  redis_data:
  minio_data:
